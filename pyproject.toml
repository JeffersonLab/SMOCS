[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smocs"
version = "0.1.0"
description = "Streaming Monitoring Optimization and Controls System"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Armen Kasparian", email = "armenk@jlab.org" },
    { name= "Kishansingh Rajput", email = "kishan@jlab.org"},
    { name = "Malachi Schram", email = "schram@jlab.org" }
]
dependencies = [
    "pytest==8.3.5",
    "kafka-python==2.0.2",
    "numpy==1.24.3",
    "mysql-connector-python==9.1.0",
    "gymnasium==0.29.1",
    "PyYAML==6.0.2",
    "gymnasium[mujoco]",
    "influxdb-client==1.38.0",
    "uproot==5.6.8",
]

[tool.setuptools.packages.find]
where = ["./"]