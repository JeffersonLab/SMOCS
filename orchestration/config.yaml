source: "gymnasium"

mqtt:
  topics:      
    - topic: "bl-fermi-01-dump/blinky-hub/blinky-mqtt/flowMeter-01/reading"
      channel_paths:
        rate1_value: "rate1.value"
        rate1_low: "rate1.alarm.limits.low"
        rate1_high: "rate1.alarm.limits.high"
        rate2_value: "rate2.value"
        rate2_low: "rate2.alarm.limits.low"
        rate2_high: "rate2.alarm.limits.high"
        rate3_value: "rate3.value"
        rate3_low: "rate3.alarm.limits.low"
        rate3_high: "rate3.alarm.limits.high"
      timestamp_path: "timeStamp"

epics:
    source: CEBAF
    PVs:
      - IPMK203.XPOS
      - IPMK203.YPOS
      - IPMK203.PHAS
      - IPMK101.XPOS
      - IPMK101.YPOS
      - IPMK101.PHAS
      - IPMK401.XPOS
      - IPMK401.YPOS
      - IPMK401.PHAS
      
gymnasium:
  environment: "Pendulum-v1"
  input_topic: "gymnasium-action"
  output_topics:
    sarsa: "gymnasium-sarsa"
    state: "gymnasium-state"
    decomposed: "gymnasium-output"
  blocking_mode: true  # Must be true for RL agent
  default_action_strategy: "random"
  step_delay: 0.0
  reset_on_start: true
  max_episode_steps: 200
  render_mode: null

kafka:
  auto_create: true
  partitions: 1
  replication_factor: 1

# Autoencoder agents (existing)
autoencoder_agent1:
  preprocessing_pipeline:
    - bounds_normalizer
    - window_processor
  window_size: 5
  min_training_samples: 100
  encoder_dims: [64, 32, 16]
  learning_rate: 0.0001
  batch_size: 16
  samples_multiplier: 3
  epochs: 10
  enabled_threads: ['ingest', 'training', 'inference']
  model_input:
      channels:
      - state_0
      - state_1
      - state_2
      bounds:
      - [-1.0, 1.0]
      - [-1.0, 1.0]
      - [-8.0, 8.0]
  model_output:
      channels:
      - state_0
      - state_1
      - state_2
  kafka_topics:
    input: "gymnasium-output"
    output: "autoencoder1-anomalies"
    training_output: "autoencoder1-training-results"

autoencoder_agent2:
  preprocessing_pipeline:
    - bounds_normalizer
    - window_processor
  window_size: 5
  min_training_samples: 100
  encoder_dims: [64, 32, 16]
  learning_rate: 0.0001
  batch_size: 16
  samples_multiplier: 3
  epochs: 10
  enabled_threads: ['ingest', 'training', 'inference']
  model_input:
      channels:
      - IPMK203.XPOS
      - IPMK203.YPOS
      - IPMK203.PHAS
      - IPMK101.XPOS
      - IPMK101.YPOS
      - IPMK101.PHAS
      - IPMK401.XPOS
      - IPMK401.YPOS
      - IPMK401.PHAS
      bounds:
      - [-10.0, 10.0]
      - [-10.0, 10.0]
      - [-10.0, 10.0]
      - [-10.0, 10.0]
      - [-10.0, 10.0]
      - [-10.0, 10.0]
      - [-10.0, 10.0]
      - [-10.0, 10.0]
      - [-10.0, 10.0]
  model_output:
      channels:
      - IPMK203.XPOS
      - IPMK203.YPOS
      - IPMK203.PHAS
      - IPMK101.XPOS
      - IPMK101.YPOS
      - IPMK101.PHAS
      - IPMK401.XPOS
      - IPMK401.YPOS
      - IPMK401.PHAS
  kafka_topics:
    input: "CEBAF"
    output: "autoencoder2-anomalies"
    training_output: "autoencoder2-training-results"

# RL Control Agent Configuration
rl_control_agent1:
  # Environment configuration
  environment: "Pendulum-v1"
  
  # JLab agent configuration
  jlab_agent_type: "KerasTD3-v0"
  jlab_agent_config_path: "/app/jlab_configs/keras_td3.cfg"
  
  # Buffer configuration
  buffer_type: "ER-v0"
  buffer_size: 1000000
  
  # Thread configuration
  enabled_threads: ['ingest', 'training', 'inference']
  
  # Kafka topics (must match gymnasium wrapper output)
  kafka_topics:
    input_sarsa: "gymnasium-sarsa"
    input_state: "gymnasium-state"
    output_action: "gymnasium-action"

  # Thread configs  
  data_ingest:
    use_pipeline_sync: true
    pipeline_timeout_sec: 100.0
  
  training:
    check_interval_ms: 10
    use_pipeline_sync: true
    pipeline_timeout_sec: 100.0
  
  inference:
    train_mode: true
    use_pipeline_sync: true
    pipeline_timeout_sec: 100.0
    log_lock_wait_threshold_ms: 100
  
  # Logging directory
  logdir: "./logs/rl_agent1"

csv:
  # Path to CSV file inside container
  file_path: "/app/data/2024-05-14-rf-ndx-raw-supplement.csv"
  
  # Column containing timestamps
  date_column: "Date"
  
  # Date format string
  date_format: "%Y-%m-%d_%H:%M:%S"
  
  # Optional: Filter by date range
  # start_date: "2024-05-14_09:31:00"
  # end_date: "2024-05-14_09:31:11"
  
  # Kafka topic to send data to
  kafka_topic: "csv_timeseries_data"
  
  # Source identifier for messages
  source: "csv_file_producer"
  
  # Columns to exclude from the channels data
  exclude_columns:
    - "level_0"
  
  # Delay between sending messages (seconds, 0 for no delay)
  send_delay: 0.0
  
  # Loop playback continuously
  loop_playback: false

project:
  name: "smocs-gymnasium-rl-control"