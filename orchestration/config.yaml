source: "gymnasium"

mqtt:
  topics:      
    - topic: "bl-fermi-01-dump/blinky-hub/blinky-mqtt/flowMeter-01/reading"
      channel_paths:
        rate1_value: "rate1.value"
        rate1_low: "rate1.alarm.limits.low"
        rate1_high: "rate1.alarm.limits.high"
        rate2_value: "rate2.value"
        rate2_low: "rate2.alarm.limits.low"
        rate2_high: "rate2.alarm.limits.high"
        rate3_value: "rate3.value"
        rate3_low: "rate3.alarm.limits.low"
        rate3_high: "rate3.alarm.limits.high"
      timestamp_path: "timeStamp"

epics:
    source: CEBAF
    PVs:
      - IPMK203.XPOS
      - IPMK203.YPOS
      - IPMK203.PHAS
      - IPMK101.XPOS
      - IPMK101.YPOS
      - IPMK101.PHAS
      - IPMK401.XPOS
      - IPMK401.YPOS
      - IPMK401.PHAS
      
gymnasium:
  environment: "SCORE-IndustryParticleAccelerator-v0"
  input_topic: "gymnasium-action"
  output_topic: "gymnasium-output"
  blocking_mode: false
  default_action_strategy: "random"
  step_delay: 0.1
  reset_on_start: true
  max_episode_steps: 10000000  # null uses environment default
  render_mode: null        # "human", "rgb_array", or null

kafka:
  auto_create: true
  partitions: 1
  replication_factor: 1

# Autoencoders for industry environment
autoencoder_agent1:
  # Explicit preprocessing pipeline - executed in order
  preprocessing_pipeline:
    - bounds_normalizer
    - window_processor
  # For no preprocessing, use: preprocessing_pipeline: []
  window_size: 20
  min_training_samples: 100
  encoder_dims: [32, 16]
  learning_rate: 0.0001
  batch_size: 16
  samples_multiplier: 3
  epochs: 10
  enabled_threads: ['ingest', 'training', 'inference']
  model_input:
      channels:
      - state_0
      - state_1
      
      bounds:
      - [0.5, 2.0]
      - [0.0, 1000.0]
      
  model_output:
      channels:
      - state_0
      - state_1

  kafka_topics:
    input: "gymnasium-output"
    output: "autoencoder1-anomalies"
    training_output: "autoencoder1-training-results"

autoencoder_agent2:
  # Explicit preprocessing pipeline - executed in order
  preprocessing_pipeline:
    - bounds_normalizer
    - window_processor
  # For no preprocessing, use: preprocessing_pipeline: []
  window_size: 20
  min_training_samples: 100
  encoder_dims: [32, 16]
  learning_rate: 0.0001
  batch_size: 16
  samples_multiplier: 3
  epochs: 10
  enabled_threads: ['ingest', 'training', 'inference']
  model_input:
      channels:
      - state_2
      - state_3
      
      bounds:
      - [0.0, 1.0]
      - [0.5, 2.0]
      
  model_output:
      channels:
      - state_2
      - state_3

  kafka_topics:
    input: "gymnasium-output"
    output: "autoencoder2-anomalies"
    training_output: "autoencoder2-training-results"

