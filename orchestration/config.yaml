source: "CEBAF"

epics:
    source: CEBAF
    PVs:
      - SOL:i:BarPress2
      - GAS:i::CDC_Temps-CDC_D1_Temp
      - GAS:i::CDC_Temps-CDC_D3_Temp
      - GAS:i::CDC_Temps-CDC_D4_Temp
      - GAS:i::CDC_Temps-CDC_D5_Temp
      - HD:coda:daq:run_number
      - HD:coda:daq:status
      - IBCAD00CRCUR6

kafka:
  auto_create: true
  partitions: 1
  replication_factor: 1

linear_regression_agent1:
  enabled_threads: ['inference']
  model_input:
    channel: SOL:i:BarPress2
  model_output:
    name: predicted_fdc_gain
  regression_parameters:
    intercept: -1.649127
    coefficient: 1.969937e-02
  kafka_topics:
    input: "CEBAF"
    output: "linear-regression1-predictions"

linear_regression_cdc_ttod_agent:
  enabled_threads: ['inference']
  model_input:
    channels:
      - SOL:i:BarPress2
      - GAS:i::CDC_Temps-CDC_D1_Temp
      - GAS:i::CDC_Temps-CDC_D3_Temp
      - GAS:i::CDC_Temps-CDC_D4_Temp
      - GAS:i::CDC_Temps-CDC_D5_Temp
    derived_inputs:
      cdc_pressure_over_temperature:
        type: pressure_over_temperature
        pressure_channel: SOL:i:BarPress2
        temperature_channels:
          - GAS:i::CDC_Temps-CDC_D1_Temp
          - GAS:i::CDC_Temps-CDC_D3_Temp
          - GAS:i::CDC_Temps-CDC_D4_Temp
          - GAS:i::CDC_Temps-CDC_D5_Temp
        kelvin_offset: 273.15
        minimum_pressure: 50.0
        maximum_pressure: 150.0
  model_output:
    channels:
      - predicted_cdc_ttod_a1
      - predicted_cdc_ttod_b1
      - predicted_cdc_ttod_c1
      - predicted_cdc_ttod_a2
      - predicted_cdc_ttod_b2
      - predicted_cdc_ttod_c2
  regression_parameters:
    predicted_cdc_ttod_a1:
      intercept: 2.0157
      coefficients: {cdc_pressure_over_temperature: -2.9468}
    predicted_cdc_ttod_b1:
      intercept: -1.1960
      coefficients: {cdc_pressure_over_temperature: 3.1979}
    predicted_cdc_ttod_c1:
      intercept: 0.6225
      coefficients: {cdc_pressure_over_temperature: -1.8051}
    predicted_cdc_ttod_a2:
      intercept: -2.3818
      coefficients: {cdc_pressure_over_temperature: 6.8484}
    predicted_cdc_ttod_b2:
      intercept: 3.1014
      coefficients: {cdc_pressure_over_temperature: -10.5439}
    predicted_cdc_ttod_c2:
      intercept: -2.4503
      coefficients: {cdc_pressure_over_temperature: 7.9724}
  kafka_topics:
    input: "CEBAF"
    output: "cdc-ttod-predictions"

gp_agent1:
  enabled_threads: ['inference']
  model:
    # Mount the model directory at /app/models in the GP agent container.
    path: "/app/models/gp_model.joblib"
    format: "joblib"  # Supported formats: joblib, pickle
    version: "gp_model-v1"
    return_std: true
  # Order is significant and must exactly match the order used to train the model.
  model_input:
    channels:
      - SOL:i:BarPress2
      - GAS:i::CDC_Temps-CDC_D1_Temp
      - GAS:i::CDC_Temps-CDC_D3_Temp
      - GAS:i::CDC_Temps-CDC_D4_Temp
      - GAS:i::CDC_Temps-CDC_D5_Temp
  model_output:
    name: "predicted_cdc_adc_ascale"
  kafka_topics:
    input: "CEBAF"
    output: "gp1-predictions"

ccdb_consumer:
  kafka_topics:
    - "linear-regression1-predictions"
    - "cdc-ttod-predictions"
    - "gp1-predictions"
  consumer_group: "ccdb-calibration-writer-v1"
  variation: "ceac"
  run_end_event_type: "run_end"
  table_assignments:
    fdc_digi_scales:
      path: "/FDC/digi_scales"
      variation: "ceac"
      rows:
        - [predicted_fdc_gain, 0.8, 0.115]
    cdc_drift_parameters:
      path: "/CDC/drift_parameters"
      variation: "ceac"
      rows:
        - [predicted_cdc_ttod_a1, predicted_cdc_ttod_a2, 0, predicted_cdc_ttod_b1, predicted_cdc_ttod_b2, 0, predicted_cdc_ttod_c1, predicted_cdc_ttod_c2, 0, 1.1, -0.08]
        - [predicted_cdc_ttod_a1, {negate: predicted_cdc_ttod_a2}, 0, predicted_cdc_ttod_b1, {negate: predicted_cdc_ttod_b2}, 0, predicted_cdc_ttod_c1, {negate: predicted_cdc_ttod_c2}, 0, 1.1, -0.08]
    cdc_digi_scales:
      path: "/CDC/digi_scales"
      variation: "ceac"
      rows:
        - [predicted_cdc_adc_ascale, 0.8]

project:
  name: "smocs-gymnasium-rl-control"