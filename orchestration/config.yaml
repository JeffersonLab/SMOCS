mqtt:
  topics:      
    - topic: "bl-fermi-01-dump/blinky-hub/blinky-mqtt/flowMeter-01/reading"
      channel_paths:
        rate1_value: "rate1.value"
        rate1_low: "rate1.alarm.limits.low"
        rate1_high: "rate1.alarm.limits.high"
        rate2_value: "rate2.value"
        rate2_low: "rate2.alarm.limits.low"
        rate2_high: "rate2.alarm.limits.high"
        rate3_value: "rate3.value"
        rate3_low: "rate3.alarm.limits.low"
        rate3_high: "rate3.alarm.limits.high"
      timestamp_path: "timeStamp"

epics:
    source: CEBAF
    PVs:
      - IPMK203.XPOS
      - IPMK203.YPOS
      - IPMK203.PHAS
      - IPMK101.XPOS
      - IPMK101.YPOS
      - IPMK101.PHAS
      - IPMK401.XPOS
      - IPMK401.YPOS
      - IPMK401.PHAS
      - IGLK100HVPSkVolts
      - ITFHALLAMODE
      - ITFFCupK6485correctedCur.VAL
      
gymnasium:
  # Environment settings
  render_mode: null  # Options: null, 'human', 'rgb_array'
  max_episode_steps: 100  # Truncate episodes after this many steps; null uses the environment's registered default (none for the envs in this repo)

  # Environment selection: keep exactly one of the templates below uncommented.
  # env_kwargs are passed to the environment's __init__ via gym.make(environment, **env_kwargs).
  # rl_control_agent1 builds its local env from these same settings.

  # --- UITF-v0 (smocs/control_plane/uitf_env.py) ---
  environment: "UITF-v0"
  env_kwargs:
    # Questions: 1) Are absolute & relative positions registered with different PVs? 2) Can action PVs be used to both set and read corrector values?
    obs_pv_names: ['IPMK403.XPOS', 'IPMK403.YPOS', 'MLHK402H.BDL', 'MLHK402V.BDL']      # e.g. 'IPMK101.XPOS' & 'IPMK101.YPOS' are BPMs. We need to confirm that these are ABSOLUTE positions.
    obs_min: [-1.0, -1.0, 4.0, 4.0]
    obs_max: [1.0, 1.0, 6.0, 6.0]
    obs_rtol: [1e-5, 1e-5, 1e-5, 1e-5]
    obs_atol: [1e-8, 1e-8, 1e-8, 1e-8]
    action_pv_names: ['MLHK402H.BDL', 'MLHK402V.BDL']     # Are these used to both set and read corrector PVs?
    action_min: [-0.1, -0.1]
    action_max: [0.1, 0.1]      # doesn't have to cover the whole range of the corrector PVs since mode is 'delta'. If mode = 'abs', it must cover the full range.
    action_rtol: [1e-5, 1e-5]
    action_atol: [1e-8, 1e-8]
    action_design_settings: [5.0, 5.0]     # ideal current for corrector PVs - used to set the magnet current in an env.reset()
    action_min_perturbation: [-0.1, -0.1]
    action_max_perturbation: [0.1, 0.1]
    action_abs_min: [4.0, 4.0]    # Absolute setpoint limits for the action PVs. Required in 'delta' mode; in 'abs' mode omit them or set them equal to action_min/action_max
    action_abs_max: [6.0, 6.0]
    bpm_pv_names: ['IPMK403.XPOS', 'IPMK403.YPOS']
    bpm_pv_refs: [0.0, 0.0]
    bpm_terminate_atol: [0.1, 0.1]   # Absolute tolerance for BPM termination condition
    transient_time: 0.1
    put_timeout: 5.0   # Max seconds to wait for the IOC to finish processing all action puts before raising
    connection_timeout: 5.0   # Max seconds to wait for each PV to connect on the first reset() before raising
    mode: 'delta'
    dry_run: true       # Must be set to false for the agent to actually move the correctors.

  # --- SCORE-IndustryParticleAccelerator-v0 (smocs/control_plane/proxy_industry_env.py) ---
  # environment: "SCORE-IndustryParticleAccelerator-v0"
  # env_kwargs:
  #   gym_space_type: "array"  # Must stay "array": the RL agent expects a flat observation/action vector

  # --- WaveGenerator-v0 (smocs/control_plane/wave_generator_env.py) ---
  # environment: "WaveGenerator-v0"
  # env_kwargs:
  #   reference_period: 100
  #   default_wave_type: 0      # 0=Sine
  #   default_amplitude: 5.0
  #   default_frequency: 3
  #   default_drift: 0.0
  #   default_noise_level: 0.5
  #   auto_anomaly_enabled: true
  #   auto_anomaly_p_per_step: 0.01   # ~1 anomaly per 100 steps
  #   auto_anomaly_cooldown: 100
  #   auto_anomaly_dur_min: 20
  #   auto_anomaly_dur_max: 100
  #   auto_anomaly_mag_min: 1.5
  #   auto_anomaly_mag_max: 5.0

  # Kafka topics
  input_topic: "gymnasium-action"
  output_topics:
    sarsa: "gymnasium-sarsa"
    state: "gymnasium-state"
    decomposed: "gymnasium-output"

  # Operation mode
  # Set these to match the environment selected above:
  #   UITF-v0:                              blocking_mode: true,  default_action_strategy: "noop", invalid_action_strategy: "clip"
  #   SCORE-IndustryParticleAccelerator-v0: blocking_mode: true,  default_action_strategy: "zero", invalid_action_strategy: "clip"
  #   WaveGenerator-v0:                     blocking_mode: false, default_action_strategy: "zero", invalid_action_strategy: "default"
  blocking_mode: true  # true = wait for Kafka actions, false = step with default actions when none arrive
  default_action_strategy: "noop"  # Options: 'random', 'zero', 'noop'. 'noop' asks the env what "do nothing" means (UITF 'abs' mode: hold the current setpoint, where zeros would drive the correctors to their lower limit); only for envs that define noop_action() (currently UITF), otherwise the controller fails at startup
  invalid_action_strategy: "clip"  # What to do with an out-of-bounds action. 'default': replace it with the default action (safe for command-like actions, e.g. WaveGenerator). 'clip': clip it to the nearest valid action (continuous controls, e.g. UITF). Malformed actions (wrong shape, NaN) always get the default action
  step_delay: 0.1  # Delay in seconds between steps (10 steps/sec)
  reset_on_start: true  # Reset environment on startup

kafka:
  auto_create: true
  partitions: 1
  replication_factor: 1

autoencoder_agent1:
  preprocessing_pipeline:
    - bounds_normalizer
    - window_processor
  window_size: 5
  min_training_samples: 100
  encoder_dims: [64, 32, 16]
  learning_rate: 0.0001
  batch_size: 16
  samples_multiplier: 3
  epochs: 10
  enabled_threads: ['ingest', 'training', 'inference']
  model_input:
      channels:
      - IPMK101.XPOS
      - IPMK101.YPOS
      - IGLK100HVPSkVolts
      - ITFHALLAMODE
      - ITFFCupK6485correctedCur.VAL
      
      bounds:
      - [-2.0, 2.0]
      - [-2.0, 2.0]
      - [10.0, 200.0]
      - [0.0, 5.0]
      - [0.0, 65.0]

      switch: # By default switch follows "AND" operation; #TODO: Define AND, OR combination logic
        IGLK100HVPSkVolts: 
          greater_than: 10.0
        ITFHALLAMODE:
          greater_than: 0.0 
        ITFFCupK6485correctedCur.VAL:
          greater_than: 0.0
      
  kafka_topics:
    input: "CEBAF"
    output: "autoencoder1-anomalies"
    training_output: "autoencoder1-training-results"

autoencoder_agent2:
  preprocessing_pipeline:
    - bounds_normalizer
    - window_processor
  window_size: 5
  min_training_samples: 100
  encoder_dims: [64, 32, 16]
  learning_rate: 0.0001
  batch_size: 16
  samples_multiplier: 3
  epochs: 10
  enabled_threads: ['ingest', 'training', 'inference']
  model_input:
      channels:
      - IPMK203.XPOS
      - IPMK203.YPOS
      
      bounds:
      - [-2.0, 2.0]
      - [-2.0, 2.0]
      
  kafka_topics:
    input: "CEBAF"
    output: "autoencoder2-anomalies"
    training_output: "autoencoder2-training-results"

contextual_autoencoder_agent1:
  preprocessing_pipeline:
    - bounds_normalizer
    - window_processor
  window_size: 10
  min_training_samples: 100
  # Maximum permitted gap, in seconds, between the timestamps of two consecutively
  # ingested rows before DBManager concludes that data collection was interrupted and
  # begins a new block_id. This value should be set with reference to the sensor's
  # expected sampling interval, plus a reasonable tolerance for network or processing
  # jitter, so that ordinary variation in arrival time is not mistaken for an
  # interruption. If this key is omitted from the configuration entirely, gap-based
  # block splitting is disabled outright; DBManager will then only start a new block
  # when a configured context column's value changes (see the context_channels entry
  # under model_input, below).
  max_gap_seconds: 5.0
  # How far back sample_batch looks, and in what order it considers each block's
  # candidate sequences, when assembling a training batch - see DBManager.sample_batch.
  # These are set explicitly here, matching sample_batch's own defaults, rather than
  # left to fall back on them implicitly.
  sampling_lookback: "24h"
  sampling_strategy: "latest"
  encoder_dims: [64, 32, 16]
  learning_rate: 0.0001
  batch_size: 16
  samples_multiplier: 3
  epochs: 10
  anomaly_threshold_type: fixed
  threshold: 0.001
  enabled_threads: ['ingest', 'training', 'inference']
  model_input:
    channels:
      - state_signal_0   # WaveGeneratorEnv 'signal' — the wave sample to reconstruct
    bounds:
      - [-100.0, 100.0]
    context_channels:
      # WaveGeneratorEnv 'condition' (declared, not actual) — the intended shape of
      # the wave. Auto-injected anomalies perturb the actual signal without moving
      # these, so a mismatch here means a genuine reconfiguration (context_drift),
      # while an unexplained mismatch in state_signal_0 means a real anomaly.
      - state_condition_0   # wave_type: 0=sine, 1=square, 2=sawtooth, 3=triangle
      - state_condition_1   # amplitude
      - state_condition_2   # frequency
      - state_condition_3   # drift
    context_bounds:
      - [0.0, 3.0]
      - [1.0, 20.0]
      - [1.0, 20.0]
      - [-20.0, 20.0]
    # Declared condition values only change on an explicit CONFIGURE/RESET_WITH_PARAMS
    # command (see WaveGeneratorEnv._apply_wave_config) — no per-step sensor noise like
    # a real PV readback — so an exact-equality-ish tolerance is appropriate. 1e-6 rather
    # than literal 0 as a defensive margin against float round-trip precision changes.
    context_tolerance: 1e-6
  kafka_topics:
    input: "gymnasium-output"
    output: "cae1-anomalies"
    training_output: "cae1-training-results"

rl_control_agent1:
  soct_agent_type: "KerasTD3-v0"
  soct_agent_config_path: "keras_td3.cfg"
  buffer_type: "ER-v0"
  buffer_size: 1000000
  enabled_threads: ['ingest', 'training', 'inference']
  kafka_topics:
    input_sarsa: "gymnasium-sarsa"
    input_state: "gymnasium-state"
    output_action: "gymnasium-action"
  data_ingest:
    use_pipeline_sync: true
    pipeline_timeout_sec: 100.0
  training:
    check_interval_ms: 10
    use_pipeline_sync: true
    pipeline_timeout_sec: 100.0
    lock_timeout_sec: 2.0    
  inference:
    train_mode: true
    use_pipeline_sync: true
    pipeline_timeout_sec: 100.0
    log_lock_wait_threshold_ms: 100
  logdir: "./logs/rl_agent1"

project:
  name: "smocs-gymnasium-rl-control"