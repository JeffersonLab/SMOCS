source: "gymnasium"

mqtt:
  topics:      
    - topic: "bl-fermi-01-dump/blinky-hub/blinky-mqtt/flowMeter-01/reading"
      channel_paths:
        rate1_value: "rate1.value"
        rate1_low: "rate1.alarm.limits.low"
        rate1_high: "rate1.alarm.limits.high"
        rate2_value: "rate2.value"
        rate2_low: "rate2.alarm.limits.low"
        rate2_high: "rate2.alarm.limits.high"
        rate3_value: "rate3.value"
        rate3_low: "rate3.alarm.limits.low"
        rate3_high: "rate3.alarm.limits.high"
      timestamp_path: "timeStamp"

epics:
    source: CEBAF
    PVs:
      - IPM9A01.XPOS
      - IPM9A01.YPOS
      - IPM9A01.PHAS
      - IPM9A02.XPOS
      - IPM9A02.YPOS
      - IPM9A02.PHAS

gymnasium:
  environment: "HalfCheetah-v4"
  input_topic: "gymnasium-action"
  output_topic: "gymnasium-output"
  blocking_mode: false
  default_action_strategy: "random"
  step_delay: 0.1
  reset_on_start: true
  max_episode_steps: 10000000  # null uses environment default
  render_mode: null        # "human", "rgb_array", or null

kafka:
  auto_create: true
  partitions: 1
  replication_factor: 1

autoencoder_agent:
  window_size: 3
  min_training_samples: 500
  encoder_dims: [32, 16]
  learning_rate: 0.001
  batch_size: 4
  epochs: 50
  kafka_topics:
    input: "gymnasium-output"
    output: "autoencoder-anomalies"
    training_output: "autoencoder-training-results"

project:
  name: "smocs-gym-streaming"