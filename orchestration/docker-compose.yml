services:
  kafka-broker:
    image: apache/kafka:3.8.0
    hostname: kafka-broker
    container_name: kafka-broker
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker:9093'
      KAFKA_LISTENERS: 'CONTROLLER://kafka-broker:9093,PLAINTEXT://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'test-broker'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - kafka-net

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks:
      - kafka-net

  source-kafka-producer:
    build:
      context: ../
      dockerfile: ./orchestration/containers/source-kafka-producer/Dockerfile
    environment:
      KAFKA_BROKER_URL: kafka-broker:9092
      CONFIG_PATH: /app/config.yaml
      PYTHONPATH: /app
    networks:
      - kafka-net
    depends_on:
      kafka-broker:
        condition: service_healthy
    restart: unless-stopped

  epics-kafka-producer:
    extends: source-kafka-producer
    profiles: ["epics"]
    platform: linux/amd64
    environment:
      EPICS_CA_ADDR_LIST: ${EPICS_CA_ADDR_LIST}
    command: ["python", "-m", "smocs.producers.epics_kafka_producer"]

  mqtt-kafka-producer:
    extends: source-kafka-producer
    profiles: ["mqtt"]
    environment:
      MQTT_BROKER: ${MQTT_BROKER}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    command: ["python", "-m", "smocs.producers.mqtt_kafka_producer"]

  gymnasium-kafka-controller:
    build:
      context: ../
      dockerfile: ./orchestration/containers/gymnasium-kafka-controller/Dockerfile
    profiles: ["gymnasium"]
    depends_on:
      kafka-broker:
        condition: service_healthy
    environment:
      KAFKA_BROKER_URL: kafka-broker:9092
      KAFKA_GROUP_ID: gym-wrapper
      CONFIG_PATH: /app/config.yaml
      PYTHONPATH: /app
    networks:
      - kafka-net
    restart: unless-stopped
    command: ["python", "-m", "smocs.control_plane.gymnasium_kafka_controller"]

  influxdb-consumer:
    build:
      context: ../
      dockerfile: ./orchestration/containers/influxdb-consumer/Dockerfile
    depends_on:
      kafka-broker:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      KAFKA_BROKER_URL: kafka-broker:9092
      KAFKA_TOPIC: my-topic
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      PYTHONPATH: /app
    networks:
      - kafka-net
    command: ["sh", "-c", "sleep 15 && exec python -m smocs.consumers.influxdb_kafka_consumer"]

  autoencoder-agent:
    build:
      context: ../
      dockerfile: ./orchestration/containers/autoencoder-agent/Dockerfile
    profiles: ["gymnasium", "epics", "mqtt"]
    depends_on:
      kafka-broker:
        condition: service_healthy
    environment:
      KAFKA_BROKER_URL: kafka-broker:9092
      MYSQL_HOST: localhost  
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_DATABASE: agentdb
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CONFIG_PATH: /app/config.yaml
      PYTHONPATH: /app
    networks:
      - kafka-net
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    command: ["/bin/bash", "/entrypoint.sh"]


volumes:
  influxdb-data:
  grafana-storage:
  mysql-data:

networks:
  kafka-net:
    driver: bridge