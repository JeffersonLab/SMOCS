services:
  kafka-broker:
    image: apache/kafka:3.8.0
    hostname: kafka-broker
    container_name: kafka-broker
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker:9093'
      KAFKA_LISTENERS: 'CONTROLLER://kafka-broker:9093,PLAINTEXT://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'test-broker'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - kafka-net

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks:
      - kafka-net

  source-kafka-producer:
    build:
      context: ../
      dockerfile: ./orchestration/containers/source-kafka-producer/Dockerfile
    profiles: ["base-only"]
    environment:
      KAFKA_BROKER_URL: kafka-broker:9092
      CONFIG_PATH: /app/config.yaml
      PYTHONPATH: /app
    networks:
      - kafka-net
    depends_on:
      kafka-broker:
        condition: service_healthy
    restart: unless-stopped

  epics-kafka-producer:
    extends: source-kafka-producer
    profiles: ["epics"]
    platform: linux/amd64
    environment:
      EPICS_CA_ADDR_LIST: ${EPICS_CA_ADDR_LIST}
      SMOCS_LOG_LEVEL: INFO
    command: ["python", "-m", "smocs.producers.epics_kafka_producer"]

  mqtt-kafka-producer:
    extends: source-kafka-producer
    profiles: ["mqtt"]
    environment:
      MQTT_BROKER: ${MQTT_BROKER}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      SMOCS_LOG_LEVEL: INFO
    command: ["python", "-m", "smocs.producers.mqtt_kafka_producer"]

  gymnasium-kafka-controller:
    build:
      context: ../
      dockerfile: ./orchestration/containers/gymnasium-kafka-controller/Dockerfile
    profiles: ["gymnasium"]
    depends_on:
      kafka-broker:
        condition: service_healthy
    environment:
      KAFKA_BROKER_URL: kafka-broker:9092
      KAFKA_GROUP_ID: gym-wrapper
      CONFIG_PATH: /app/config.yaml
      PYTHONPATH: /app
      SMOCS_LOG_LEVEL: INFO
    networks:
      - kafka-net
    restart: unless-stopped
    command: ["python", "-m", "smocs.control_plane.gymnasium_kafka_controller"]

  influxdb-consumer:
    build:
      context: ../
      dockerfile: ./orchestration/containers/influxdb-consumer/Dockerfile
    depends_on:
      kafka-broker:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      KAFKA_BROKER_URL: kafka-broker:9092
      KAFKA_TOPIC: my-topic
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      PYTHONPATH: /app
      SMOCS_LOG_LEVEL: CRITICAL
    networks:
      - kafka-net
    command: ["sh", "-c", "sleep 15 && exec python -m smocs.consumers.influxdb_kafka_consumer"]

  agent:
    build:
      context: ../
      dockerfile: ./orchestration/containers/agent/Dockerfile
    profiles: ["base-only"]
    depends_on:
      kafka-broker:
        condition: service_healthy
    environment:
      KAFKA_BROKER_URL: kafka-broker:9092
      MYSQL_HOST: ${MYSQL_HOST}  
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CONFIG_PATH: /app/config.yaml
      PYTHONPATH: /app
    networks:
      - kafka-net
    restart: unless-stopped
    command: ["/bin/bash", "/entrypoint.sh"]

  autoencoder-agent1:
    extends: agent
    profiles: ["autoencoder1"]
    environment:
      AGENT_TYPE: autoencoder
      AGENT_CONFIG: autoencoder_agent1
      SMOCS_LOG_LEVEL: INFO
    ports:
      - "3307:3306"
    volumes:
      - mysql-data-ae1:/var/lib/mysql

  autoencoder-agent2:
    extends: agent
    profiles: ["autoencoder2"]
    environment:
      AGENT_TYPE: autoencoder
      AGENT_CONFIG: autoencoder_agent2
      SMOCS_LOG_LEVEL: INFO
    ports:
      - "3305:3305"
    volumes:
      - mysql-data-ae2:/var/lib/mysql

  rl-control-agent1:
    extends: agent
    profiles: ["rl1"]
    environment:
      AGENT_TYPE: rl_control
      AGENT_CONFIG: rl_control_agent1
      SMOCS_LOG_LEVEL: INFO
    ports:
      - "3308:3306"
      - "6006:6006"  # TensorBoard port
    volumes:
      - mysql-data-rl1:/var/lib/mysql
      - soct-configs:/app/soct_configs:ro  # Read-only mount for soct configs
      - ./tb-logs:/app/logs:rw  # Mount for RL agent logs and models
    depends_on:
      kafka-broker:
        condition: service_healthy
      gymnasium-kafka-controller:
        condition: service_started

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles: ["ui"]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - kafka-net
    depends_on:
      kafka-broker:
        condition: service_healthy
  
  # NOTE: Before building jlab-llm-agent or ollama-agent for the first time (or after modifying
  # containers/llm-agent/Dockerfile), build the shared base image first.
  # Preferred (from orchestration/): make build-jlab  OR  make build-ollama  — handles base image automatically.
  # Manual fallback (from orchestration/): docker build -t llm-agent-base:latest -f containers/llm-agent/Dockerfile .

  ollama-agent:
    build:
      context: ./
      dockerfile: ./containers/llm-agent/ollama-agent/Dockerfile
    container_name: ollama-agent
    profiles: ["ollama-agent"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    environment:
      API_TYPE: ollama
      LLM_NAME: qwen3-coder:30b                       # good & small BUT required special parsing for tool call | qwen2.5-coder:14b-instruct ==> so many edits | qwen2.5/3:14b good but not enough | phi4:14b has no tool calling | mistral-small:24b is bad at using tools | qwen3:30b didn't yield better results
      OLLAMA_NUM_CTX: 131072                          # read by Ollama server as server-wide default (overrides vram heuristic and Modelfile); model supports up to 262144
      OLLAMA_CONTEXT_LENGTH: 131072                   # read by Python/ChatOllama as per-request num_ctx fallback
      OLLAMA_KEEP_ALIVE: -1                           # Keep model in VRAM indefinitely between requests
      OLLAMA_KV_CACHE_TYPE: q8_0                      # required at 131072 ctx: ~16GB KV cache vs ~32GB at f16; fits within ~22GB available after model
    volumes:                                          # NOTE: Mapped volumes are not affected by "context" under "build".
      - /var/run/docker.sock:/var/run/docker.sock     # To launch sibling sontainers
      - ../SMOCS_DOCS:/app/SMOCS_DOCS:ro              # Expose documentation
      - ../smocs:/app/smocs:ro                        # Expose code
      - ../orchestration:/app/orchestration:rw        # Need to edit config.yaml & docker-compose.yml. WARNING: Might edit wrong files ===> Human approval MUST be obtained to edit !!!
      - ollama-models:/root/.ollama:rw                # To pull the LLM_NAME model only during the first run.
    ports:
      - "8000:8000"                               # chainlit default port is 8000. Post is mapped to access chainlit from localhost
  
  jlab-llm-agent:
    build:
      context: ./
      dockerfile: ./containers/llm-agent/jlab-llm-agent/Dockerfile
    container_name: jlab-llm-agent
    profiles: ["jlab-llm-agent"]
    restart: unless-stopped
    env_file:
      - path: ../.env.API_KEY       # SMOCS/.env.API_KEY - JLAB_API_KEY
        required: true
    environment:
      API_TYPE: openai
      LLM_URL: "https://API.delphi.jlab.org"
      #LLM_NAME: "openai/gpt-oss-120b"
      #LLM_NAME: "Qwen/Qwen3-30B-A3B-Instruct-2507"
      LLM_NAME: "google/gemma-4-31B-it"
    volumes:                                          # NOTE: Mapped volumes are not affected by "context" under "build".
      - /var/run/docker.sock:/var/run/docker.sock     # To launch sibling sontainers
      - ../SMOCS_DOCS:/app/SMOCS_DOCS:ro              # Expose documentation
      - ../smocs:/app/smocs:ro                        # Expose code
      - ../orchestration:/app/orchestration:rw        # Need to edit config.yaml & docker-compose.yml. WARNING: Might edit wrong files ===> Human approval MUST be obtained to edit !!!
    ports:
      - "8000:8000"                               # chainlit default port is 8000. Post is mapped to access chainlit from localhost
        
volumes:
  influxdb-data:
  grafana-storage:
  mysql-data-ae1:
  mysql-data-ae2:
  mysql-data-rl1:  
  soct-configs: 
  rl-logs-1: 
  ollama-models: 

networks:
  kafka-net:
    driver: bridge